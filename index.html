<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spanish 1000 — Vocabulary Quiz</title>
<meta name="theme-color" content="#b5361f">
<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#1f1b16; --muted:#6f665b; --line:#e7dfd2;
    --accent:#b5361f; --accent-ink:#fff; --ok:#1f7a4d; --ok-bg:#e3f3ea; --bad:#b3261e; --bad-bg:#fbe7e5;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17140f; --card:#221e18; --ink:#f3ede4; --muted:#a99f92; --line:#3a332a;
      --accent:#e0623f; --ok:#5cc48d; --ok-bg:#1d3628; --bad:#ff8a80; --bad-bg:#3d2120; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:560px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{flex:1 1 auto;min-width:64px;padding:10px 12px;border:1px solid var(--line);background:transparent;
    color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--muted);font-size:.92rem}
  input[type=number],input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);width:90px}
  input[type=search]{width:100%}
  .primary{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);
    color:var(--accent-ink);font:600 1.05rem system-ui,sans-serif;cursor:pointer}
  .primary:disabled{opacity:.4;cursor:default}
  .secondary{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:transparent;
    color:var(--ink);font:500 1rem system-ui,sans-serif;cursor:pointer;margin-top:10px}
  .stats{display:flex;gap:14px;font-size:.9rem;color:var(--muted)}
  .stats b{color:var(--ink)}
  /* quiz */
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:6px}
  .prompt{font-size:2.1rem;font-weight:700;text-align:center;margin:18px 0 6px;word-break:break-word;letter-spacing:-.01em}
  .prompt.en{font-size:1.5rem}
  .hint{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer;min-height:56px}
  .opt kbd{font:600 .75rem system-ui;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .opt.ok{border-color:var(--ok);background:var(--ok-bg)}
  .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
  .opt:disabled{cursor:default}
  .opt.dim{opacity:.55}
  .feedback{min-height:28px;text-align:center;margin:14px 0 6px;font-weight:600}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  /* results */
  .score{font-size:3rem;font-weight:800;text-align:center;margin:6px 0 0}
  .score small{font-size:1.1rem;color:var(--muted);font-weight:500}
  .verdict{text-align:center;color:var(--muted);margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
  td.es{font-weight:600;white-space:nowrap}
  td.n{color:var(--muted);font-size:.8rem;width:2.5em}
  td.pos{color:var(--muted);font-size:.8rem;white-space:nowrap}
  .yourans{color:var(--bad);font-size:.85rem}
  .hidden{display:none!important}
  .empty{color:var(--muted);text-align:center;padding:12px}
  .listwrap{max-height:65vh;overflow:auto;margin-top:10px}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Español <span>1000</span></h1>
    <div>
      <button class="link" id="navBrowse">Word list</button>
      <button class="link hidden" id="navHome">Home</button>
    </div>
  </header>

  <!-- SETUP -->
  <section id="setup">
    <div class="card">
      <h2>Words to include (by frequency rank)</h2>
      <div class="seg" id="rangeSeg">
        <button data-r="1-100">Top 100</button>
        <button data-r="1-250">Top 250</button>
        <button data-r="1-500">Top 500</button>
        <button data-r="1-1000">All 1000</button>
        <button data-r="custom">Custom</button>
      </div>
      <div class="row hidden" id="customRow">
        From <input type="number" id="rFrom" min="1" max="1000" value="1">
        to <input type="number" id="rTo" min="1" max="1000" value="1000">
      </div>
    </div>
    <div class="card">
      <h2>Direction</h2>
      <div class="seg" id="dirSeg">
        <button data-d="es-en">Spanish → English</button>
        <button data-d="en-es">English → Spanish</button>
        <button data-d="mix">Mixed</button>
      </div>
    </div>
    <div class="card">
      <h2>Questions</h2>
      <div class="seg" id="countSeg">
        <button data-c="10">10</button>
        <button data-c="20">20</button>
        <button data-c="30">30</button>
        <button data-c="50">50</button>
      </div>
    </div>
    <button class="primary" id="startBtn">Start quiz</button>
    <button class="secondary" id="reviewBtn">Practise my missed words</button>
    <div class="card" style="margin-top:14px">
      <h2>Your progress</h2>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qmeta"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="card">
      <div class="prompt" id="qPrompt"></div>
      <div class="hint" id="qHint"></div>
      <div class="opts" id="qOpts"></div>
      <div class="feedback" id="qFeedback"></div>
      <button class="primary hidden" id="nextBtn">Next</button>
    </div>
    <button class="link" id="quitBtn">Quit quiz</button>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <div class="score" id="rScore"></div>
      <div class="verdict" id="rVerdict"></div>
    </div>
    <div class="card" id="rMissedCard">
      <h2>Words to review</h2>
      <table id="rMissed"></table>
    </div>
    <button class="primary" id="retryMissedBtn">Retry the ones I missed</button>
    <button class="secondary" id="againBtn">New quiz, same settings</button>
    <button class="secondary" id="homeBtn">Change settings</button>
  </section>

  <!-- BROWSE -->
  <section id="browse" class="hidden">
    <div class="card">
      <input type="search" id="search" placeholder="Search Spanish or English…" autocomplete="off">
      <div class="listwrap"><table id="wordTable"></table></div>
    </div>
  </section>

  <footer>1000 most frequent Spanish words (lemmas), ranked using spoken-Spanish frequency data.</footer>
</main>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
